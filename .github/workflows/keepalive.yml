name: Supabase keep-alive

# Free Supabase projects pause after 7 days of no activity. This makes a tiny
# read request on a schedule so the project always counts as "active".
#
# One-time setup — add two repo secrets under
#   GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#     SUPABASE_URL       = https://apyeuocfloljuzywofqr.supabase.co
#     SUPABASE_ANON_KEY  = your publishable / anon key (the VITE_SUPABASE_ANON_KEY value)
#
# Note: GitHub disables scheduled workflows after 60 days with no repo commits.
# Any push (or clicking "Run workflow") re-enables it.

on:
  schedule:
    - cron: "17 3 * * *" # daily, ~03:17 UTC (off the hour to avoid GitHub's busy-time delays)
  workflow_dispatch: {} # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Clean the secret: strip whitespace/newlines, surrounding quotes, trailing slash.
          url="$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]' | tr -d '"'"'" )"
          url="${url%/}"
          key="$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')"

          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_ANON_KEY repo secret."
            exit 1
          fi
          # Show the host being contacted (not secret) so a bad URL is obvious in the log.
          echo "Pinging host: $(printf '%s' "$url" | sed -E 's#^https?://##; s#/.*$##')"
          case "$url" in
            https://*.supabase.co) : ;;
            *) echo "::warning::SUPABASE_URL doesn't look like https://<ref>.supabase.co — got '$url'";;
          esac

          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${url}/rest/v1/categories?select=id&limit=1" \
            -H "apikey: ${key}" \
            -H "Authorization: Bearer ${key}") && rc=0 || rc=$?

          if [ "${rc:-0}" -ne 0 ]; then
            echo "::error::curl could not reach Supabase (exit $rc). Check the SUPABASE_URL secret is exactly https://<your-ref>.supabase.co with no quotes or spaces."
            exit 1
          fi
          echo "Supabase responded with HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Keep-alive ping failed (HTTP $code). 401/403 = wrong anon key; 404 = wrong project URL."
            exit 1
          fi
          echo "Keep-alive ping OK."
